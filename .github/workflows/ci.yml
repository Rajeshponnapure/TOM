name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt ruff

      - name: Syntax-compile all first-party modules
        run: python -m compileall -q agent.py main.py tom_desktop_app.py safety tools agents demo tests

      - name: Lint (syntax errors, undefined names)
        run: ruff check .

      - name: Tests
        run: pytest -v
