name: CI
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Syntax-compile all first-party modules
        run: |
          python -m py_compile agent.py main.py tom_desktop_app.py safety/guards.py tools/*.py
      - name: Install test runner
        run: pip install pytest
      - name: Pure-logic tests (router, skills, knowledge)
        run: pytest tests/ -v
